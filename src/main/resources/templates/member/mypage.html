<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 부산 맛집 탐방</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/place/list}">🌊 부산 맛집 지도</a>
        <div class="ms-auto d-flex align-items-center">
            <!-- 자동 로그아웃 카운트다운 타이머 배지 -->
            <span id="sessionTimerBadge" th:if="${session.loginMember != null}" class="badge bg-light text-dark me-2 fw-normal" title="5분간 무입력 시 자동 로그아웃">⏱️ 05:00</span>
            <a th:href="@{/place/list}" class="btn btn-outline-light btn-sm">맛집 목록</a>
            <a th:href="@{/member/logout}" class="btn btn-light btn-sm ms-2">로그아웃</a>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h4 class="card-title fw-bold mb-0 text-primary">👤 마이페이지</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/member/modify}" method="post">
                <div class="mb-3">
                    <label class="form-label text-muted small">이메일 계정</label>
                    <input type="text" class="form-control bg-light" th:value="${dto != null ? dto.email : ''}" readonly>
                </div>

                <div class="mb-3">
                    <label for="nickname" class="form-label fw-semibold">닉네임</label>
                    <input type="text" class="form-control" id="nickname" name="nickname" th:value="${dto != null ? dto.nickname : ''}" required>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-semibold">새 비밀번호 (선택)</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="변경할 비밀번호 입력 (선택사항)">
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <button type="submit" class="btn btn-primary">정보 수정</button>
                </div>
            </form>

            <hr class="my-4">

            <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small">더 이상 서비스를 이용하지 않으시나요?</span>
                <form th:action="@{/member/withdraw}" method="post" onsubmit="return confirm('정말 탈퇴하시겠습니까?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">회원 탈퇴</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white py-4 border-top text-center text-muted mt-auto">
    <div class="container">
        <p class="mb-0">© 2026 부산 맛집 탐방 서비스. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 5분 무활동 자동 로그아웃 스크립트 -->
<script th:if="${session.loginMember != null}" src="/js/auto-logout.js"></script>

</body>
</html>
