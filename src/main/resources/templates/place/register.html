<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${dto == null || dto.pno == null} ? '신규 맛집 등록' : '맛집 정보 수정'">맛집 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 700px;">
    <!-- 제목 조건부 표시 -->
    <h2 class="mb-4 text-center" th:text="${dto == null || dto.pno == null} ? '🌊 신규 맛집 등록' : '✏️ 맛집 정보 수정'"></h2>

    <form th:action="${dto == null || dto.pno == null} ? @{/place/register} : @{/place/modify}" method="post">

        <!-- 수정 시 필수 PK hidden -->
        <input type="hidden" name="pno" th:value="${dto?.pno}">

        <!-- 페이징/검색 조건 유지용 hidden -->
        <input type="hidden" name="page" th:value="${pageRequestDTO?.page}">
        <input type="hidden" name="size" th:value="${pageRequestDTO?.size}">
        <input type="hidden" name="guName" th:value="${pageRequestDTO?.guName}">
        <input type="hidden" name="category" th:value="${pageRequestDTO?.category}">
        <input type="hidden" name="keyword" th:value="${pageRequestDTO?.keyword}">

        <!-- 1. 식당 이름 -->
        <div class="mb-3">
            <div class="col-md-6">
               <label class="form-label fw-bold">식당 이름</label>
               <input type="text" name="restaurantNameKo" class="form-control" placeholder="예: 해변시장상가 자갈치생선구이"
                   th:value="${dto?.restaurantNameKo}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Restaurant Name</label>
                <input type="text" name="restaurantNameEn" class="form-control" placeholder="ex: Haebyeon Market Grilled Fish"
                       th:value="${dto?.restaurantNameEn}" required>
            </div>
        </div>

        <!-- 2. 지역구 & 카테고리 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">지역구</label>
                <input type="text" name="guName" class="form-control" placeholder="예: 해운대구, 강서구"
                       th:value="${dto?.guName}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">카테고리</label>
                <input type="text" name="category" class="form-control" placeholder="예: 한식/생선구이"
                       th:value="${dto?.category}" required>
            </div>
        </div>

        <!-- 3. 주소 -->
        <div class="mb-3">
            <label class="form-label fw-bold">주소</label>
            <input type="text" name="address" class="form-control" placeholder="부산광역시 해운대구 좌동로 91"
                   th:value="${dto?.address}">
        </div>

        <!-- 4. 대표 메뉴 및 가격 -->
        <div class="mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">대표 메뉴</label>
              <input type="text" name="mainMenu" class="form-control" placeholder="예: 생선구이정식 ₩11,000"
                   th:value="${dto?.mainMenu}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">가격대</label>
                <input type="text" name="priceRange" class="form-control" placeholder="1~3만원대"
                       th:value="${dto?.priceRange}">
            </div>
        </div>

        <!-- 5. 영업시간 및 쉬는 시간 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">영업시간</label>
                <input type="text" name="operatingHours" class="form-control" placeholder="예: 11:00-21:00"
                       th:value="${dto?.operatingHours}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">브레이크 타임</label>
                <input type="text" name="breakTime" class="form-control" placeholder="예: 15:00-17:00 (없으면 미입력)"
                       th:value="${dto?.breakTime}">
            </div>
        </div>

        <!-- 5-1. 전화번호 및 주차여부 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">전화번호</label>
                <input type="text" name="phone" class="form-control" placeholder="예: 051-700-0000"
                       th:value="${dto?.phone}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">주차여부</label>
                <input type="text" name="parking" class="form-control" placeholder="예: 주차가능 Y/주차장없음 N"
                       th:value="${dto?.parking}">
            </div>
        </div>
        <!-- 6. 휴무일 -->
        <div class="mb-4">
            <label class="form-label fw-bold">휴무일</label>
            <input type="text" name="offDays" class="form-control" placeholder="예: 연중무휴, 월요일 휴무"
                   th:value="${dto?.offDays}">
        </div>
        <!-- 7. 한글 요약 -->
        <div class="mb-4">
            <label class="form-label fw-bold">소개 요약</label>
            <input type="text" name="summary_ko" class="form-control" placeholder="예: 갈미조개를 샤브샤브, 수육, 구이 등 다양한 방식으로 선보이는 갈미조개 전문점"
                   th:value="${dto?.summary_ko}">
        </div>
        <!-- 8. 영문 요약 -->
        <div class="mb-4">
            <label class="form-label fw-bold">Summary</label>
            <input type="text" name="summary_en" class="form-control" placeholder="ex: A restaurant specializing in hen clam shabu-shabu and grilled dishes."
                   th:value="${dto?.summary_en}">
        </div>

        <!-- 하단 버튼 -->
        <div class="d-flex justify-content-between">
            <a th:href="@{/place/list(page=${pageRequestDTO?.page}, size=${pageRequestDTO?.size}, guName=${pageRequestDTO?.guName}, category=${pageRequestDTO?.category}, keyword=${pageRequestDTO?.keyword})}"
               class="btn btn-secondary">취소 및 목록으로</a>
            <!-- 1. [공공데이터 맛집 가져오기] 버튼 추가 -->
            <button type="button" id="btnSyncOpenData" class="btn btn-info text-white me-2">
                공공데이터 맛집 가져오기
            </button>
            <button type="submit" class="btn btn-primary"
                    th:text="${dto == null || dto.pno == null} ? '등록하기' : '수정완료'"></button>
            <a th:href="@{/place/list}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
<!-- 스크립트 영역 추가 -->
<script>
    document.getElementById('btnSyncOpenData').addEventListener('click', function () {
        if (!confirm('공공데이터 포털에서 부산 맛집 정보를 가져와 DB에 등록하시겠습니까?\n(데이터 양에 따라 수 초 정도 소요될 수 있습니다.)')) {
            return;
        }

        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 가져오는 중...';

        fetch('/place/sync-opendata', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('서버 응답 오류');
                }
                return response.text();
            })
            .then(msg => {
                alert(msg);
                // 수집 완료 후 맛집 목록 페이지로 이동
                window.location.href = '/place/list';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('공공데이터 수집 도중 오류가 발생했습니다.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = '공공데이터 맛집 가져오기';
            });
    });
</script>
</body>
</html>
