<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>카카오 지도 연동</title>
  <style>
    #map {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body>

<h2>카카오 지도</h2>

<!-- 지도를 표시할 div -->
<div id="map"></div>

<!-- Kakao Map API 스크립트 불러오기 (발급받은 JavaScript 키 입력) -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=85e3512f4615c1ab4c6aa7d98ac7e10a"></script>

<script>
  const container = document.getElementById('map'); // 지도를 담을 영역의 DOM 레퍼런스
  const options = { // 지도 생성 옵션
    center: new kakao.maps.LatLng(37.5665, 126.9780), // 지도의 중심좌표 (서울시청 기준)
    level: 3 // 지도의 확대 레벨
  };

  // 지도 생성 및 객체 리턴
  const map = new kakao.maps.Map(container, options);

  // 마커가 표시될 위치 설정
  const markerPosition  = new kakao.maps.LatLng(37.5665, 126.9780);

  // 마커 생성
  const marker = new kakao.maps.Marker({
    position: markerPosition
  });

  // 마커가 지도 위에 표시되도록 설정
  marker.setMap(map);
</script>

</body>
</html>
